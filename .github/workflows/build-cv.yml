name: Build CV

on:
  push:
    paths:
      - "applications/**"
      - "data/**"
      - "profiles/**"
      - "templates/**"
  workflow_dispatch:
    inputs:
      application:
        description: "Application folder name to build (leave empty to build all changed)"
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run python -m scripts.validate
      - run: uv run pytest

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra latexmk
      - name: Determine applications to build
        id: apps
        run: |
          if [ -n "${{ github.event.inputs.application }}" ]; then
            echo "list=${{ github.event.inputs.application }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE=$(git hash-object -t tree /dev/null)
            fi
            CHANGED=$(git diff --name-only "$BEFORE" ${{ github.sha }} -- applications/ | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "list=$CHANGED" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and compile
        run: |
          for app in ${{ steps.apps.outputs.list }}; do
            uv run python -m scripts.generate "$app"
          done
      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/*/cv.pdf || true
          git diff --cached --quiet || git commit -m "chore: rebuild CV PDF(s)"
          git push
